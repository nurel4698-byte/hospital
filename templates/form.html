{% extends 'base.html' %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<h1>{{ title }}</h1>
<div class="form-box">
    <form method="post" enctype="multipart/form-data">{% csrf_token %}
        {{ form.as_p }}
        <button class="btn" type="submit">{{ button|default:"Сохранить" }}</button>
        <a class="btn gray" href="{% url 'home' %}">Отмена</a>
    </form>
    {% if hint %}<p class="muted">{{ hint }}</p>{% endif %}
</div>
{% endblock %}
